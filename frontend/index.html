<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>پادرا — سفر با سبک</title>
  <meta name="description" content="خرید آنلاین بلیط هواپیما، قطار و اتوبوس در ایران با بهترین قیمت" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('theme');
        var isDark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (isDark) document.documentElement.classList.add('dark-mode-init');
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div id="root"></div>
  <script>
    (function () {
      if (document.documentElement.classList.contains('dark-mode-init')) {
        document.body.classList.add('dark-mode');
      }
    })();
  </script>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
